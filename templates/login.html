<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.1" />
  <title>Sign in — Tichu</title>
  <link rel="stylesheet" href="/static/styles.css?v=1.0">
  <link rel="icon" href="{{ url_for('static', filename='TichuIconV1-iOS-Default-128x128@1x.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='TichuIconV1-iOS-Default-128x128@1x.png') }}">
</head>
<body>

  <!-- Global nav -->
  <nav>
    <a href="/" class="nav-title">
      Tichu Dashboard
    </a>
</nav>

  <!-- Main content -->
  <main class="hero">
    <div class="card">
      <img src="{{ url_for('static', filename='TichuIconV1-iOS-Default-1024x1024@1x.png') }}" alt="Tichu" class="error-logo" />
      <h1>Sign in</h1>
  
      <!-- replace the error div and form -->
      {% if error %}
      <div class="error-msg visible">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="8" cy="8" r="7.5" stroke="#cc0000"/>
          <path d="M8 4.5V8.5" stroke="#cc0000" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="8" cy="11" r="0.75" fill="#cc0000"/>
        </svg>
        Incorrect password. Please try again.
      </div>
      {% endif %}

<form method="POST" action="/dashlogin" id="loginForm">

      <form method="POST" action="/dashlogin" id="loginForm">
        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="btn-primary">Sign in</button>
      </form>

      <div class="divider"></div>
      <p class="footer-note">For app access, use the <a href="#">Tichu iOS app</a>.</p>
    </div>
  </main>

  <!-- Page footer -->
  <footer>
    Copyright &copy; 2026 Drakynem. All rights reserved.
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("error")) {
      document.getElementById("errorMsg").classList.add("visible");
    }
  </script>

</body>
</html>
